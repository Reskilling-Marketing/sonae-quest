<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!--
    全国概略マップ（粗い日本地図のシンボリック版）
    通信断絶時にも「今ここがどのへんか」のメンタルモデルを失わないため、
    アプリと一緒に precache される。詳細な避難所確認は通信復旧後に公式情報で。
  -->
  <rect width="800" height="1000" fill="#fef9f2"/>
  <text x="400" y="50" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#0f766e">📡 通信断絶時の概略マップ</text>
  <text x="400" y="78" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#64748b">詳細は通信復旧後に公式情報で照合してください</text>

  <!-- 海 -->
  <rect x="50" y="100" width="700" height="850" rx="20" fill="#cfe9f5" stroke="#0f766e" stroke-width="2"/>

  <!-- 北海道 -->
  <g fill="#a7f3d0" stroke="#065f46" stroke-width="2">
    <path d="M520,150 L660,170 L680,250 L640,310 L560,300 L500,260 Z"/>
  </g>
  <text x="590" y="240" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#065f46">北海道</text>

  <!-- 本州 -->
  <g fill="#a7f3d0" stroke="#065f46" stroke-width="2">
    <path d="M180,400 L350,380 L460,420 L540,460 L620,500 L660,560 L600,600 L520,620 L420,600 L340,580 L240,540 L180,490 Z"/>
  </g>
  <text x="280" y="475" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#065f46">東北</text>
  <text x="430" y="510" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#065f46">関東</text>
  <text x="540" y="555" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" font-weight="700" fill="#065f46">中部</text>

  <!-- 関西〜中国 -->
  <g fill="#a7f3d0" stroke="#065f46" stroke-width="2">
    <path d="M180,640 L300,620 L380,640 L420,680 L380,720 L280,720 L200,690 Z"/>
  </g>
  <text x="280" y="680" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#065f46">関西・中国</text>
  <!-- 大阪マーカー -->
  <circle cx="320" cy="680" r="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="320" y="668" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" font-weight="700" fill="#7f1d1d">大阪</text>

  <!-- 四国 -->
  <g fill="#a7f3d0" stroke="#065f46" stroke-width="2">
    <path d="M250,750 L370,740 L380,790 L260,790 Z"/>
  </g>
  <text x="320" y="775" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#065f46">四国</text>

  <!-- 九州 -->
  <g fill="#a7f3d0" stroke="#065f46" stroke-width="2">
    <path d="M120,720 L210,710 L240,810 L160,840 L100,790 Z"/>
  </g>
  <text x="170" y="775" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#065f46">九州</text>

  <!-- 沖縄 -->
  <g fill="#a7f3d0" stroke="#065f46" stroke-width="2">
    <ellipse cx="120" cy="900" rx="40" ry="14"/>
  </g>
  <text x="120" y="905" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" font-weight="700" fill="#065f46">沖縄</text>

  <!-- 凡例 -->
  <g transform="translate(540 820)">
    <rect width="200" height="120" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="100" y="28" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#0f766e">凡例</text>
    <circle cx="22" cy="55" r="6" fill="#dc2626"/>
    <text x="38" y="60" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" fill="#1f2937">大阪サンプル避難所</text>
    <rect x="18" y="78" width="14" height="14" fill="#a7f3d0" stroke="#065f46"/>
    <text x="40" y="90" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" fill="#1f2937">陸地</text>
    <rect x="18" y="100" width="14" height="14" fill="#cfe9f5" stroke="#0f766e"/>
    <text x="40" y="112" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" fill="#1f2937">海</text>
  </g>

  <text x="400" y="970" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#94a3b8">
    そなえクエスト | 簡易概略図のため位置・形状は実際と異なります
  </text>
</svg>
